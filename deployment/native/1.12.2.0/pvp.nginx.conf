server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 16m;
  location ^~ /engines/1.12.1.2/ { proxy_pass http://game-1-12-1-2/; }
  location ^~ /engines/1.12.1.3/ { proxy_pass http://game-1-12-1-3/; }
  location ^~ /engines/1.12.2.0/ { proxy_pass http://game-1-12-2-0/; }
  location /api/ {
    proxy_pass http://server:8001/;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(js|css|json|png|webp|ogg|mp3|wav|woff2?|ttf)$ {
    try_files $uri =404;
  }
}
