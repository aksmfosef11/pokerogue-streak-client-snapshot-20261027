server {
  listen 80;
  client_max_body_size 16m;
  location /api/ { proxy_pass http://server:8001/; proxy_read_timeout 60s; }
  location ^~ /engines/1.12.1.2/ { proxy_pass http://game-1-12-1-2/; }
  location ^~ /engines/1.12.1.3/ { proxy_pass http://game-1-12-1-3/; }
  location ^~ /engines/1.12.2.0/ { proxy_pass http://game-1-12-2-0/; }
  location / { proxy_pass http://game-1-12-2-0; }
}
